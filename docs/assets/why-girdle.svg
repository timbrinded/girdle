<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="benefits-title benefits-description">
  <title id="benefits-title">Why Girdle: measured speed, progress checks and shell checks</title>
  <desc id="benefits-description">In the recorded warm Muse Spark 1.3 Contributor comparisons of 26–27 September 2026, fast flow took roughly half the mean completion time of default flow with the same observed pass rate: 19.4 versus 38.8 seconds on small fixtures, and 33.2 versus 66.2 seconds on real repositories. Repository context and batched tools reduce model round trips. Jev can nudge unfinished work and redirect loops or drift. The shell tripwire blocks recognized catastrophic cases from parsed commands and judges other risks and authorization. Checkpoints are probabilistic; ordinary sessions use the account's permissions and are not an OS sandbox.</desc>
  <rect width="1000" height="620" rx="20" fill="#f5f2e9"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#202822">
    <text x="40" y="40" font-size="16" font-weight="700" letter-spacing="2" fill="#285c48">WHY GIRDLE</text>
    <text x="40" y="89" font-size="34" font-weight="700" letter-spacing="-.6">Faster tasks. Checks that keep work moving.</text>

    <rect x="40" y="128" width="272" height="368" rx="14" fill="#285c48"/>
    <g fill="none" stroke="#f5f2e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="85" cy="177" r="22"/>
      <path d="M85 164v13l10 7M79 147h12M85 147v8M102 155l6-6"/>
    </g>
    <g fill="#f5f2e9">
      <text x="65" y="273" font-size="78" font-weight="700" letter-spacing="-3">≈2×</text>
      <text x="65" y="321" font-size="42" font-weight="700">faster</text>
      <text x="65" y="364" font-size="17">Warm Muse Spark suites</text>
      <text x="65" y="393" font-size="17">Fast flow vs default</text>
      <text x="65" y="444" font-size="17">Same model and</text>
      <text x="65" y="472" font-size="17">observed pass rate.</text>
    </g>

    <g fill="none" stroke="#d9d7ca" stroke-width="1.5">
      <path d="M346 242h614M346 378h614M40 524h920"/>
    </g>

    <g fill="none" stroke="#bd5637" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m377 137-19 27h15l-5 23 22-31h-15z"/>
    </g>
    <text x="412" y="157" font-size="26" font-weight="700">Fewer model round trips</text>
    <text x="412" y="190" font-size="18">Code arrives with the task.</text>
    <text x="412" y="218" font-size="18">Reads and edits run in batches.</text>

    <g fill="none" stroke="#285c48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M390 289a19 19 0 1 0-4 19M390 277v12h-12"/>
      <path d="m379 312 7-4-5-7"/>
    </g>
    <text x="412" y="293" font-size="26" font-weight="700">Keep unfinished work moving</text>
    <text x="412" y="326" font-size="18">Jev can nudge the next turn</text>
    <text x="412" y="354" font-size="18">and redirect loops or drift.</text>

    <g fill="none" stroke="#285c48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m373 405 18 7v15c0 13-18 23-18 23s-18-10-18-23v-15z"/>
      <path d="m363 426 7 7 13-14"/>
    </g>
    <text x="412" y="429" font-size="26" font-weight="700">Check shell risk before execution</text>
    <text x="412" y="462" font-size="18">Parsed catastrophic cases are blocked.</text>
    <text x="412" y="490" font-size="18">Jev judges risk and authorization.</text>

    <text x="40" y="555" font-size="17">Recorded warm comparisons: Muse Spark 1.3 Contributor · 26–27 September 2026</text>
    <text x="40" y="585" font-size="17" fill="#566056">Probabilistic checkpoints. Ordinary sessions retain your account's permissions.</text>
  </g>
</svg>
